# Netlify build configuration for the SvelteKit app.
#
# The Netlify UI had a stale `dist/client` publish directory (a leftover from a
# different build tool). `@sveltejs/adapter-netlify` publishes to `build/`, so
# pin it here — this file is the source of truth for the build.
[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"
